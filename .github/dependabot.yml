version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Angular, TypeScript et zone.js doivent monter ensemble, sinon npm ci échoue (conflit de peer deps)
      angular:
        patterns: ["@angular/*", "typescript", "zone.js"]
      frontend-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@angular/*", "typescript", "zone.js"]
    ignore:
      # suivre la version de Node utilisée (22), pas la dernière
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
