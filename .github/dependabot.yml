version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # ioredis-mock (repli sans Redis) n'accepte que ioredis ^5
      - dependency-name: ioredis
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # les paquets Angular doivent monter ensemble, sinon npm ci échoue (conflit de peer deps)
      angular:
        patterns: ["@angular/*"]
      frontend-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@angular/*"]
    ignore:
      # types cassés (ApexDrilldownEvent manquant)
      - dependency-name: apexcharts
        versions: ["5.16.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
