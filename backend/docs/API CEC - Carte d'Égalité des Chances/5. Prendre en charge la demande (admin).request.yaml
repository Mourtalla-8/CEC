$kind: http-request
description: Assigne la demande à l'admin connecté.
url: "{{baseUrl}}/api/demandes/{{demandeId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAdmin}}
body:
  type: text
  content: |-
    {
      "statut": "en_cours_traitement",
      "commentairesAdmin": "Dossier complet, traitement démarré"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('statut en_cours_traitement', () => pm.expect(pm.response.json().data.statut).to.eql('en_cours_traitement'));
    language: text/javascript
order: 5000
