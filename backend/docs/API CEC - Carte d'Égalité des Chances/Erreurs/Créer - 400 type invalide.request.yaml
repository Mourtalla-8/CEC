$kind: http-request
url: "{{baseUrl}}/api/demandes"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenHandicap}}
body:
  type: text
  content: |-
    {
      "type": "premiere"
    }
scripts:
  - type: afterResponse
    code: pm.test('400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
