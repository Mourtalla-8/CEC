$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{emailHandicap}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 1000
